cards:
  - label: "Pricing"
    title: "Make the commercial trade-offs explicit"
    detail: "Connect pricing analysis with product performance, customer outcomes and the risks around a decision."
  - label: "Customer intelligence"
    title: "Model behaviour to support business choices"
    detail: "Experience with customer lifetime value, segmentation, churn and product recommendation."
  - label: "Model assurance"
    title: "Challenge the assumptions behind the output"
    detail: "A validation background informs how I assess limitations, evidence and the appropriate use of a model."
  - label: "Communication"
    title: "Give stakeholders a decision they can assess"
    detail: "Explain the question, analytical approach and limitations in language suited to business and technical audiences."
